<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Agrotres S.A. · Calidad e Inocuidad (Est. 5258)</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --border: #e2e8f0;
      --primary: #0f4c81;
      --primary-dark: #0a365c;
      --primary-light: #e0f2fe;
      --ok-bg: #dcfce7;
      --ok-tx: #166534;
      --warn-bg: #fef3c7;
      --warn-tx: #92400e;
      --bad-bg: #fee2e2;
      --bad-tx: #991b1b;
      --haccp-bg: #ffedd5;
      --haccp-tx: #9a3412;
      --pe-bg: #dbeafe;
      --pe-tx: #1e40af;
      --reg-bg: #d1fae5;
      --reg-tx: #065f46;
      --radius: 14px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      padding-bottom: 32px;
    }

    /* Header compacto móvil */
    .app-header {
      background: var(--primary);
      color: #fff;
      padding: 14px 16px 12px;
      position: sticky;
      top: 0;
      z-index: 30;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.15);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      max-width: 960px;
      margin: 0 auto;
    }

    .brand-title {
      font-size: 1.02rem;
      font-weight: 700;
      margin: 0;
    }

    .brand-sub {
      font-size: 0.76rem;
      opacity: 0.88;
      margin: 2px 0 0;
    }

    .date-pill {
      background: rgba(255, 255, 255, 0.16);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Pestañas de Sector (scroll horizontal táctil en celular) */
    .sector-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      scrollbar-width: none;
    }
    .sector-tabs::-webkit-scrollbar { display: none; }

    .sector-tab {
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.83rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sector-tab.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .main-wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 14px 16px;
    }

    /* Selector de Modo: Base Documental vs Registro Diario */
    .mode-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 14px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      padding: 10px 8px;
      border-radius: 9px;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: #fff;
      color: var(--primary);
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12);
    }

    /* Resumen rápido del día */
    .summary-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      text-align: center;
    }

    .stat-num {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
    }

    .stat-lbl {
      font-size: 0.72rem;
      color: var(--muted);
      font-weight: 600;
    }

    /* Buscador y filtros */
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .search-bar input, .form-control {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.92rem;
      background: #fff;
      color: var(--text);
    }

    .search-bar input:focus, .form-control:focus {
      outline: 2px solid var(--primary-light);
      border-color: var(--primary);
    }

    .type-filters {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .mini-chip {
      border: 1px solid var(--border);
      background: #fff;
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mini-chip.active {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Tarjetas de Base Documental */
    .doc-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .doc-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .doc-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .doc-code {
      font-weight: 800;
      font-size: 0.9rem;
      color: var(--primary);
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .b-HACCP { background: var(--haccp-bg); color: var(--haccp-tx); }
    .b-PE { background: var(--pe-bg); color: var(--pe-tx); }
    .b-Registro { background: var(--reg-bg); color: var(--reg-tx); }

    .doc-title {
      font-size: 0.98rem;
      font-weight: 700;
      margin: 0 0 6px;
    }

    .doc-vigencia {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .tag-meta {
      background: #f1f5f9;
      color: var(--text);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .tag-meta.v2026 {
      background: var(--ok-bg);
      color: var(--ok-tx);
    }

    .doc-params {
      margin: 0 0 8px;
      padding-left: 16px;
      font-size: 0.83rem;
      color: var(--text);
    }

    .doc-params li { margin-bottom: 3px; }

    .doc-note {
      background: #fffbeb;
      border-left: 3px solid #f59e0b;
      padding: 6px 10px;
      font-size: 0.78rem;
      color: #78350f;
      border-radius: 0 6px 6px 0;
      margin-top: 6px;
    }

    .doc-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 0.76rem;
      color: var(--muted);
    }

    /* Formulario de Carga Diaria */
    .panel-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }

    .panel-title {
      margin: 0 0 12px;
      font-size: 1rem;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .form-row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-primary {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary:active { background: var(--primary-dark); }

    .btn-secondary {
      background: #fff;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 7px 11px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-danger-sm {
      background: #fee2e2;
      color: #991b1b;
      border: none;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Historial de registros cargados */
    .log-item {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 10px;
      background: #fff;
    }

    .log-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .status-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
    }
    .st-Conforme { background: var(--ok-bg); color: var(--ok-tx); }
    .st-Observación { background: var(--warn-bg); color: var(--warn-tx); }
    .st-No { background: var(--bad-bg); color: var(--bad-tx); }

    .log-meta {
      font-size: 0.76rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .log-val {
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .toolbar-export {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .hidden { display: none !important; }

    .toast {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      z-index: 99;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
    }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="header-top">
      <div>
        <h1 class="brand-title">Frigorífico Agrotres S.A.</h1>
        <p class="brand-sub">Est. Oficial N.º 5258 · Calidad e Inocuidad</p>
      </div>
      <div class="date-pill" id="todayBadge"></div>
    </div>
  </header>

  <!-- Pestañas por Sector -->
  <nav class="sector-tabs" id="sectorTabs" aria-label="Sectores operativos">
    <button class="sector-tab active" data-sector="ALL" type="button">Todos los sectores</button>
    <button class="sector-tab" data-sector="corrales" type="button">Recepción y Corrales</button>
    <button class="sector-tab" data-sector="faena" type="button">Playa de Faena</button>
    <button class="sector-tab" data-sector="camaras" type="button">Despostada y Cámaras</button>
    <button class="sector-tab" data-sector="servicios" type="button">Agua, Químicos y Personal</button>
  </nav>

  <main class="main-wrap">
    <!-- Selector Principal: Base Documental vs Carga Diaria -->
    <div class="mode-switch">
      <button id="btnModeDocs" class="mode-btn active" type="button">Base Documental</button>
      <button id="btnModeDaily" class="mode-btn" type="button">Registros Diarios</button>
    </div>

    <!-- Indicadores rápidos -->
    <section class="summary-strip" id="summaryStrip"></section>

    <!-- VISTA 1: BASE DOCUMENTAL -->
    <section id="viewDocs">
      <div class="search-bar">
        <input id="docSearch" type="search" placeholder="Buscar código (PE-09, R-10), título o parámetro..." />
      </div>

      <div class="type-filters" id="typeFilters">
        <button class="mini-chip active" data-type="ALL" type="button">Todos</button>
        <button class="mini-chip" data-type="HACCP" type="button">HACCP</button>
        <button class="mini-chip" data-type="PE" type="button">Procedimientos (PE)</button>
        <button class="mini-chip" data-type="Registro" type="button">Registros (R)</button>
      </div>

      <div id="docList" class="doc-list"></div>
    </section>

    <!-- VISTA 2: REGISTROS DIARIOS -->
    <section id="viewDaily" class="hidden">
      <div class="panel-box">
        <h2 class="panel-title">Cargar Control Operativo del Día</h2>

        <div class="form-group">
          <label class="form-label" for="regSelect">Planilla / Registro (filtrado por sector activo)</label>
          <select id="regSelect" class="form-control"></select>
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label" for="regDate">Fecha</label>
            <input id="regDate" type="date" class="form-control" />
          </div>
          <div class="form-group">
            <label class="form-label" for="regTime">Hora</label>
            <input id="regTime" type="time" class="form-control" />
          </div>
        </div>

        <div id="dynamicFields"></div>

        <div class="form-row-2">
          <div class="form-group">
            <label class="form-label" for="regResp">Responsable / Operador</label>
            <input id="regResp" type="text" class="form-control" placeholder="Ej: Calidad / Turno mañana" />
          </div>
          <div class="form-group">
            <label class="form-label" for="regObs">Observación / Acción correctiva</label>
            <input id="regObs" type="text" class="form-control" placeholder="Opcional si hubo desvío" />
          </div>
        </div>

        <button id="btnSaveEntry" class="btn-primary" type="button">Guardar Registro Diario</button>
      </div>

      <div class="panel-box">
        <div style="display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px;">
          <h2 class="panel-title" style="margin:0;">Historial Cargado</h2>
          <input id="filterLogDate" type="date" class="form-control" style="width:auto; padding:6px 10px; font-size:0.82rem;" />
        </div>

        <div class="toolbar-export">
          <button id="btnExportCsv" class="btn-secondary" type="button">Descargar Excel / CSV</button>
          <button id="btnExportJson" class="btn-secondary" type="button">Respaldo JSON</button>
          <button id="btnShowAllDates" class="btn-secondary" type="button">Ver todas las fechas</button>
        </div>

        <div id="logsContainer"></div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden"></div>

    const STORAGE_KEY = "agrotres_sgc_registros_diarios_v1";

    const state = {
      sector: "ALL",
      mode: "docs",
      docSearch: "",
      docType: "ALL",
      selectedRegId: "",
      filterDate: ""
    };

    function todayISO() {
      const d = new Date();
      const tzOffset = d.getTimezoneOffset() * 60000;
      return new Date(d - tzOffset).toISOString().slice(0, 10);
    }

    function nowTime() {
      const d = new Date();
      return d.toTimeString().slice(0, 5);
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.classList.remove("hidden");
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => t.classList.add("hidden"), 2400);
    }

    function getLogs() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
      } catch (e) {
        return [];
      }
    }

    function saveLogs(list) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }

    function getSectorDocs() {
      if (state.sector === "ALL") return DOCS_DB;
      return DOCS_DB.filter(d => d.sector_tab === state.sector);
    }

    function renderSummary() {
      const sectorDocs = getSectorDocs();
      const logs = getLogs().filter(l => state.sector === "ALL" || l.sector_tab === state.sector);
      const todayLogs = logs.filter(l => l.fecha === todayISO());
      const desviosHoy = todayLogs.filter(l => l.estado && l.estado.startsWith("No conforme")).length;

      document.getElementById("summaryStrip").innerHTML = `
        <div class="stat-box">
          <div class="stat-num">${sectorDocs.length}</div>
          <div class="stat-lbl">Docs en sector</div>
        </div>
        <div class="stat-box">
          <div class="stat-num">${todayLogs.length}</div>
          <div class="stat-lbl">Controles hoy</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" style="color:${desviosHoy > 0 ? '#b91c1c' : '#166534'}">${desviosHoy}</div>
          <div class="stat-lbl">Desvíos hoy</div>
        </div>
      `;
    }

        list = list.filter(d => d.tipo === state.docType);

        const q = state.docSearch.trim().toLowerCase();
        list = list.filter(d =>
          [d.codigo, d.titulo, d.sector_nombre, d.vigencia, ...(d.parametros || []), ...(d.registros || [])]
            .join(" ")
            .toLowerCase()
            .includes(q)
        );
      }

      if (list.length === 0) {
        container.innerHTML = `<div class="panel-box" style="text-align:center; color:var(--muted);">No hay documentos que coincidan con este filtro.</div>`;
        return;
      }

      container.innerHTML = list.map(d => {
        const is2026 = String(d.vigencia).startsWith("2026");
        const quickLoadBtn = d.es_diario
          ? `<button class="btn-secondary" type="button" onclick="openDailyFor('${d.id}')">Cargar hoy →</button>`
          : `<span>Vínculos: ${(d.registros || []).join(", ") || "—"}</span>`;

        return `
          <article class="doc-card">
            <div class="doc-top">
              <span class="doc-code">${d.codigo}</span>
              <span class="badge b-${d.tipo}">${d.tipo}</span>
            </div>
            <h3 class="doc-title">${d.titulo}</h3>
            <div class="doc-vigencia">
              <span class="tag-meta">Rev. ${d.revision}</span>
              <span class="tag-meta ${is2026 ? 'v2026' : ''}">Vigencia: ${d.vigencia}</span>
              <span class="tag-meta">${d.sector_nombre}</span>
            </div>
            <ul class="doc-params">
              ${(d.parametros || []).map(p => `<li>${p}</li>`).join("")}
            </ul>
            ${d.nota_revision ? `<div class="doc-note"><strong>Nota revisión:</strong> ${d.nota_revision}</div>` : ""}
            <div class="doc-actions">
              <span>Resp: ${(d.responsables || []).slice(0, 2).join(", ")}</span>
              ${quickLoadBtn}
            </div>
          </article>
        `;
      }).join("");
    }

    function populateRegSelect() {
      const sel = document.getElementById("regSelect");
      const regs = getSectorDocs().filter(d => d.es_diario);

      sel.innerHTML = regs.map(r =>
        `<option value="${r.id}">${r.codigo} — ${r.titulo} (Rev. ${r.revision})</option>`
      ).join("");

      if (state.selectedRegId && regs.some(r => r.id === state.selectedRegId)) {
        sel.value = state.selectedRegId;
      } else if (regs.length > 0) {
        state.selectedRegId = regs[0].id;
        sel.value = state.selectedRegId;
      }

      renderDynamicFields();
    }

    function renderDynamicFields() {
      const container = document.getElementById("dynamicFields");
      const reg = DOCS_DB.find(d => d.id === document.getElementById("regSelect").value);
      if (!reg || !reg.campos_diarios) {
        container.innerHTML = "";
        return;
      }

      container.innerHTML = reg.campos_diarios.map(f => {
        if (f.type === "select") {
          return `
            <div class="form-group">
              <label class="form-label" for="dyn_${f.key}">${f.label}</label>
              <select id="dyn_${f.key}" class="form-control">
                ${f.options.map(o => `<option value="${o}">${o}</option>`).join("")}
              </select>
            </div>
          `;
        }
        return `
          <div class="form-group">
            <label class="form-label" for="dyn_${f.key}">${f.label}</label>
            <input id="dyn_${f.key}" type="text" class="form-control" placeholder="${f.placeholder || ''}" />
          </div>
        `;
      }).join("");
    }

    function renderLogs() {
      const container = document.getElementById("logsContainer");
      let logs = getLogs();

      if (state.sector !== "ALL") {
        logs = logs.filter(l => l.sector_tab === state.sector);
      }

      if (state.filterDate) {
        logs = logs.filter(l => l.fecha === state.filterDate);
      }

      if (logs.length === 0) {
        container.innerHTML = `<p style="color:var(--muted); font-size:0.86rem; text-align:center; padding:12px 0;">Todavía no hay registros cargados para este filtro.</p>`;
        return;
      }

      container.innerHTML = logs.map(item => {
        const stClass = item.estado.startsWith("Conforme")
          ? "st-Conforme"
          : item.estado.startsWith("Observación")
            ? "st-Observación"
            : "st-No";

        return `
          <div class="log-item">
            <div class="log-head">
              <strong>${item.codigo} · ${item.etapa || item.titulo}</strong>
              <span class="status-pill ${stClass}">${item.estado}</span>
            </div>
            <div class="log-meta">${item.fecha} · ${item.hora} hs · ${item.sector_nombre} · Resp: ${item.responsable || "Sin especificar"}</div>
            <div class="log-val">${item.valor || "—"}</div>
            ${item.observacion ? `<div style="font-size:0.8rem; color:#92400e;">Obs: ${item.observacion}</div>` : ""}
            <div style="text-align:right; margin-top:6px;">
              <button class="btn-danger-sm" type="button" onclick="deleteLog('${item.uid}')">Eliminar</button>
            </div>
          </div>
        `;
      }).join("");
    }

    window.openDailyFor = function (regId) {
      state.selectedRegId = regId;
      switchMode("daily");
    };

    window.deleteLog = function (uid) {
      const next = getLogs().filter(l => l.uid !== uid);
      saveLogs(next);
      renderSummary();
      renderLogs();
      showToast("Registro eliminado");
    };

    function switchMode(mode) {
      state.mode = mode;
      document.getElementById("btnModeDocs").classList.toggle("active", mode === "docs");
      document.getElementById("btnModeDaily").classList.toggle("active", mode === "daily");
      document.getElementById("viewDocs").classList.toggle("hidden", mode !== "docs");
      document.getElementById("viewDaily").classList.toggle("hidden", mode !== "daily");

      if (mode === "daily") {
        populateRegSelect();
        renderLogs();
      } else {
        renderDocsList();
      }
    }

    // Eventos
    document.getElementById("sectorTabs").addEventListener("click", e => {
      const btn = e.target.closest(".sector-tab");
      if (!btn) return;
      state.sector = btn.dataset.sector;
      document.querySelectorAll(".sector-tab").forEach(b => b.classList.toggle("active", b === btn));
      renderSummary();
      if (state.mode === "docs") {
        renderDocsList();
      } else {
        populateRegSelect();
        renderLogs();
      }
    });

    document.getElementById("btnModeDocs").addEventListener("click", () => switchMode("docs"));
    document.getElementById("btnModeDaily").addEventListener("click", () => switchMode("daily"));

    document.getElementById("docSearch").addEventListener("input", e => {
      state.docSearch = e.target.value;
      renderDocsList();
    });

    document.getElementById("typeFilters").addEventListener("click", e => {
      const chip = e.target.closest(".mini-chip");
      if (!chip) return;
      state.docType = chip.dataset.type;
      document.querySelectorAll(".mini-chip").forEach(c => c.classList.toggle("active", c === chip));
      renderDocsList();
    });

    document.getElementById("regSelect").addEventListener("change", e => {
      state.selectedRegId = e.target.value;
      renderDynamicFields();
    });

    document.getElementById("btnSaveEntry").addEventListener("click", () => {
      const reg = DOCS_DB.find(d => d.id === document.getElementById("regSelect").value);
      if (!reg) return;

      const etapaEl = document.getElementById("dyn_etapa");
      const valorEl = document.getElementById("dyn_valor");
      const estadoEl = document.getElementById("dyn_estado");

      const entry = {
        uid: String(Date.now()),
        reg_id: reg.id,
        codigo: reg.codigo,
        titulo: reg.titulo,
        sector_tab: reg.sector_tab,
        sector_nombre: reg.sector_nombre,
        fecha: document.getElementById("regDate").value || todayISO(),
        hora: document.getElementById("regTime").value || nowTime(),
        etapa: etapaEl ? etapaEl.value : "",
        valor: valorEl ? valorEl.value.trim() : "",
        estado: estadoEl ? estadoEl.value : "Conforme",
        responsable: document.getElementById("regResp").value.trim(),
        observacion: document.getElementById("regObs").value.trim()
      };

      const logs = getLogs();
      logs.unshift(entry);
      saveLogs(logs);

      if (valorEl) valorEl.value = "";
      document.getElementById("regObs").value = "";
      document.getElementById("regTime").value = nowTime();

      renderSummary();
      renderLogs();
      showToast(`Guardado: ${reg.codigo}`);
    });

    document.getElementById("filterLogDate").addEventListener("change", e => {
      state.filterDate = e.target.value;
      renderLogs();
    });

    document.getElementById("btnShowAllDates").addEventListener("click", () => {
      state.filterDate = "";
      document.getElementById("filterLogDate").value = "";
      renderLogs();
    });

    document.getElementById("btnExportCsv").addEventListener("click", () => {
      const logs = getLogs();
      if (!logs.length) {
        showToast("No hay registros diarios para exportar");
        return;
      }
      const headers = ["Fecha", "Hora", "Sector", "Codigo", "Registro", "Punto_Etapa", "Valor_Control", "Estado", "Responsable", "Observacion"];
      const rows = logs.map(l => [
        l.fecha, l.hora, l.sector_nombre, l.codigo, l.titulo, l.etapa, l.valor, l.estado, l.responsable, l.observacion
      ].map(v => `"${String(v || "").replace(/"/g, '""')}"`).join(";"));

      const csv = "﻿" + [headers.join(";"), ...rows].join("
");
      const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `agrotres-registros-diarios-${todayISO()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("btnExportJson").addEventListener("click", () => {
      const payload = {
        establecimiento: "Frigorífico Agrotres S.A. - Est. Oficial N.º 5258",
        exportado: new Date().toISOString(),
        registros_diarios: getLogs()
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `agrotres-respaldo-${todayISO()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

    // Inicialización
    const hoy = todayISO();
    document.getElementById("todayBadge").textContent = hoy.split("-").reverse().join("/");
    document.getElementById("regDate").value = hoy;
    document.getElementById("regTime").value = nowTime();
    document.getElementById("filterLogDate").value = hoy;
    state.filterDate = hoy;

    renderSummary();
    renderDocsList();
  </script>
</body>
</html>
